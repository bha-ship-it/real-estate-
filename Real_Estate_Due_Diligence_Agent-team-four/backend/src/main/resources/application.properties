spring.application.name=real-estate-due-diligence-agent

# H2 Datasource Configuration (Postgres Mode)
spring.datasource.url=jdbc:h2:mem:real_estate_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Initialize Schema
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../db_script/schema.sql
spring.sql.init.data-locations=file:../db_script/data.sql

# JWT Configuration
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdEZXZlbG9wbWVudFNlY3JldEtleUZvckhTMjU2}
app.jwt.expiration-ms=86400000
